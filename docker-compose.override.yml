# Dev override — selected by docker-compose.override.yml auto-merge.
# Builds the dev stage of Dockerfile against DEV_DOCKER_HOST.
# No source bind-mounts; source is baked into the image at build time.
# Edit → docker compose build master && docker compose up -d master
services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
    environment:
      MASTER_AGENT_NETWORK: "${BRANCH_SLUG:-dev}_internal"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${BRANCH_SLUG:-dev}-master.rule=Host(`master.${BRANCH_SLUG:-dev}.${HOST_IP_DASHED:-127-0-0-1}.nip.io`)"
      - "traefik.http.routers.${BRANCH_SLUG:-dev}-master.entrypoints=web"
      - "traefik.http.services.${BRANCH_SLUG:-dev}-master.loadbalancer.server.port=8080"
    networks:
      - internal
      - sre-traefik-public

  mosquitto:
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

networks:
  sre-traefik-public:
    external: true
