# Staging override — pulls versioned image by digest; no build section.
# Set IMAGE_DIGEST to the full digest string from the CI build.
# Example: IMAGE_DIGEST=sha256:abc123...
#
# VERSION_SLUG is derived from the image tag by staging-up.sh, e.g. v4-7-rc2.
# URL pattern: http://<service>.<version-slug>.<host-ip-dashed>.nip.io
services:
  master:
    image: ${MASTER_RUNTIME_IMAGE:?MASTER_RUNTIME_IMAGE must be set}@${IMAGE_DIGEST:?IMAGE_DIGEST must be set}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${VERSION_SLUG:-main}-master.rule=Host(`master.${VERSION_SLUG:-main}.${HOST_IP_DASHED:-127-0-0-1}.nip.io`)"
      - "traefik.http.routers.${VERSION_SLUG:-main}-master.entrypoints=web"
      - "traefik.http.services.${VERSION_SLUG:-main}-master.loadbalancer.server.port=8080"
    networks:
      - internal
      - sre-traefik-public

  mosquitto:
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

networks:
  sre-traefik-public:
    external: true
