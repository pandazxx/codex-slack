# Base compose file — the shared intersection for every environment.
# No build:, no ports:, no image digest pin.
# Always paired with exactly one overlay:
#   dev      → docker-compose.dev.yml    (via `just dev-up`)
#   staging  → docker-compose.deploy.yml (via `just deploy staging <tag>`)
#   prod     → docker-compose.deploy.yml (via `just deploy prod <tag>`)
services:
  master:
    image: ${MASTER_RUNTIME_IMAGE:-codex-slack-master:latest}
    working_dir: /opt/codex-slack
    command: ["python", "-m", "uvicorn", "src.master.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      MASTER_PORT: ${MASTER_PORT:-8080}
      MASTER_DATA_DIR: /opt/codex-slack/data/master
      MASTER_DRY_RUN: ${MASTER_DRY_RUN:-false}
      MASTER_AGENT_BASE_IMAGE: ${MASTER_AGENT_BASE_IMAGE:-}
      MASTER_RUNTIME_IMAGE: ${MASTER_RUNTIME_IMAGE:-}
      MASTER_CODEX_AUTH_JSON_PATH: ${MASTER_CODEX_AUTH_JSON_PATH:-}
      MASTER_SSH_AUTH_SOCK_PATH: ${MASTER_SSH_AUTH_SOCK_PATH:-}
      MASTER_SSH_KNOWN_HOSTS_PATH: ${MASTER_SSH_KNOWN_HOSTS_PATH:-}
      MASTER_GIT_USER_NAME: ${MASTER_GIT_USER_NAME:-}
      MASTER_GIT_USER_EMAIL: ${MASTER_GIT_USER_EMAIL:-}
      CONTAINER_RUNTIME: docker
      DOCKER_HOST: unix:///run/container.sock
      CONTAINER_HOST: unix:///run/container.sock
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      GH_TOKEN: ${GH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_IDLE_TIMEOUT_SECONDS: ${AGENT_IDLE_TIMEOUT_SECONDS:-3600}
      AGENT_AUTH_REFRESH_INTERVAL_SECONDS: ${AGENT_AUTH_REFRESH_INTERVAL_SECONDS:-43200}
      SSH_AUTH_SOCK: /run/ssh-agent.sock
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - master_data:/opt/codex-slack/data/master
      - ${MASTER_SSH_AUTH_SOCK_PATH:-/dev/null}:/run/ssh-agent.sock
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/run/container.sock
    depends_on:
      - mosquitto
    networks:
      - internal
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.21
    # Config written inline so no host-side file bind-mount is needed;
    # this keeps the stack self-contained on remote DOCKER_HOST targets.
    entrypoint:
      - sh
      - -c
      - |
        printf 'listener 1883\nallow_anonymous true\npersistence false\nlog_type error\n' \
          > /mosquitto/config/mosquitto.conf
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto > /dev/null && echo 'healthy' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  master_data:
