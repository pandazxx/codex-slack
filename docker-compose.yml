services:
  codex-slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-slack-bot:latest
    working_dir: /workspace
    command: ["python", "-m", "src.bot.main"]
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      SLACK_ALLOWED_CHANNELS: ${SLACK_ALLOWED_CHANNELS}
      CODEX_WORKSPACE_PATH: /workspace
      BOT_LOG_FILE: /workspace/logs/bot.log
      CODEX_SESSION_ID: ${CODEX_SESSION_ID}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS}
      GH_TOKEN: ${GH_TOKEN}
      GITHUB_TOKEN: ${GH_TOKEN}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      CODEX_COMMAND_TEMPLATE: codex exec --dangerously-bypass-approvals-and-sandbox resume {session_id} -
      CODEX_COMMAND_TEMPLATE_NO_SESSION: codex exec --dangerously-bypass-approvals-and-sandbox -
    volumes:
      - ./:/workspace
      - ./logs:/workspace/logs
      - ${HOME}/.codex/auth.json:/run/secrets/codex_auth.json:ro
      - ${HOME}/.codex/sessions:/run/secrets/codex_sessions:ro
    stdin_open: true
    tty: true
