services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MASTER_RUNTIME_IMAGE:-codex-slack-master:latest}
    container_name: ${MASTER_CONTAINER_NAME:-codex-slack-master}
    working_dir: /opt/codex-slack
    command: ["python", "-m", "uvicorn", "src.master.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      MASTER_PORT: ${MASTER_PORT:-8080}
      MASTER_DATA_DIR: /opt/codex-slack/data/master
      MASTER_DRY_RUN: ${MASTER_DRY_RUN:-false}
      MASTER_AGENT_BASE_IMAGE: ${MASTER_AGENT_BASE_IMAGE:-codex-slack-master:latest}
      MASTER_CODEX_AUTH_JSON_PATH: ${MASTER_CODEX_AUTH_JSON_PATH:-}
      MASTER_SSH_AUTH_SOCK_PATH: ${MASTER_SSH_AUTH_SOCK_PATH:-}
      MASTER_SSH_KNOWN_HOSTS_PATH: ${MASTER_SSH_KNOWN_HOSTS_PATH:-}
      MASTER_GIT_USER_NAME: ${MASTER_GIT_USER_NAME:-}
      MASTER_GIT_USER_EMAIL: ${MASTER_GIT_USER_EMAIL:-}
      CONTAINER_RUNTIME: ${CONTAINER_RUNTIME:-docker}
      DOCKER_HOST: unix:///run/container.sock
      CONTAINER_HOST: unix:///run/container.sock
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      GH_TOKEN: ${GH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SSH_AUTH_SOCK: /run/ssh-agent.sock
    ports:
      - "${MASTER_PORT:-8080}:8080"
    volumes:
      - ${MASTER_DATA_DIR:-./data/master}:/opt/codex-slack/data/master
      - ${MASTER_SSH_AUTH_SOCK_PATH:-/dev/null}:/run/ssh-agent.sock
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/run/container.sock
    depends_on:
      - mosquitto
    networks:
      - internal
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ${MOSQUITTO_CONTAINER_NAME:-codex-slack-mosquitto}
    entrypoint: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
