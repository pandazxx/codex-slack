x-podman:
  in_pod: false

# Podman overrides — merge with docker-compose.yml:
#   podman-compose -f docker-compose.yml -f docker-compose.podman.yml up
#
# Or set in .env:
#   CONTAINER_RUNTIME=podman
#   CONTAINER_SOCKET_PATH=/run/user/1000/podman/podman.sock

services:
  master:
    userns_mode: "keep-id"
    user: "${UID:-1000}:${GID:-1000}"
    security_opt:
      - label=disable
    environment:
      CONTAINER_RUNTIME: podman
    volumes:
      - ${CONTAINER_SOCKET_PATH:-/run/user/1000/podman/podman.sock}:/run/container.sock
