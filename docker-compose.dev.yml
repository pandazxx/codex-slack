# Dev overlay — selected explicitly by `just dev-up` and `just dev-down`.
# Extends docker-compose.yml with the build section (target: dev), Traefik
# labels, and the sre-traefik-public network. Never auto-merged; always
# passed via -f so multiple branch stacks can coexist on the same host.
services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
    environment:
      MASTER_AGENT_NETWORK: "${BRANCH_SLUG:-dev}_internal"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${BRANCH_SLUG:-dev}-master.rule=Host(`master.${BRANCH_SLUG:-dev}.${HOST_IP_DASHED:-127-0-0-1}.nip.io`)"
      - "traefik.http.routers.${BRANCH_SLUG:-dev}-master.entrypoints=web"
      - "traefik.http.services.${BRANCH_SLUG:-dev}-master.loadbalancer.server.port=8080"
    networks:
      - internal
      - sre-traefik-public

  mosquitto:
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

networks:
  sre-traefik-public:
    external: true
