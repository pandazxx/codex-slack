# CD Daemon — example compose file
#
# The CD daemon is a lightweight sidecar that polls a registry for a new image
# digest, deploys it via the master compose file, waits for a health check,
# and rolls back automatically if the master container fails to stay running.
#
# The daemon image is self-contained: the master docker-compose.yml is baked
# in at build time, so no project directory needs to be mounted on the host.
# Deploy state is persisted in a named Docker volume.
#
# Usage
# -----
#   1. Create a .env file with at minimum:
#        CD_IMAGE=ghcr.io/<org>/codex-slack-master
#        CD_DAEMON_IMAGE=ghcr.io/<org>/codex-slack-cd-daemon:<tag>
#        DOCKER_GID=<gid of the docker group on the host>
#   2. Start the daemon:
#        docker compose -f docker-compose.cd-daemon.example.yml up -d
#
# Security note
# -------------
#   The daemon is granted read/write access to the Docker socket so it can
#   manage the master container.  Restrict who can reach the socket path.

services:
  codex-slack-cd-daemon:
    # Dedicated CD daemon image — built by CI from Dockerfile.cd-daemon.
    # Much smaller than the master image: Python + Docker CLI only.
    # Set CD_DAEMON_IMAGE in .env to pin a specific sha- tag.
    image: ${CD_DAEMON_IMAGE:-ghcr.io/your-org/codex-slack-cd-daemon:latest}
    container_name: codex-slack-cd-daemon
    restart: unless-stopped
    command: ["python", "-m", "src.cd.main"]
    group_add:
      - "${DOCKER_GID:-999}"

    environment:
      # ---- Required -------------------------------------------------------
      # Full image name without tag (e.g. "ghcr.io/org/codex-slack-master").
      CD_IMAGE: ${CD_IMAGE}

      # ---- Optional -------------------------------------------------------
      # Tag to track.  "latest" for staging; a semver string for production.
      CD_IMAGE_TAG: ${CD_IMAGE_TAG:-latest}
      # Name of the master container managed by this daemon.
      CD_CONTAINER_NAME: ${CD_CONTAINER_NAME:-codex-slack-master}
      # Path to the compose file, as seen from inside this container.
      # Defaults to the file baked into the image at build time.
      CD_COMPOSE_FILE: ${CD_COMPOSE_FILE:-/opt/codex-slack/docker-compose.yml}
      # Service name inside the compose file.
      CD_COMPOSE_SERVICE: ${CD_COMPOSE_SERVICE:-master}
      # Compose binary: "docker compose" (default) or "docker-compose" (v1).
      CD_COMPOSE_BINARY: ${CD_COMPOSE_BINARY:-docker compose}
      # Extra .env file forwarded to compose via --env-file (rarely needed;
      # master vars not in this file default to empty, which is fine if the
      # master is configured through its own settings).
      CD_ENV_FILE: ${CD_ENV_FILE:-}
      # Where the daemon persists its deploy state.
      CD_STATE_FILE: ${CD_STATE_FILE:-/opt/codex-slack/data/cd/state.json}
      # Poll interval in seconds (default 5 minutes).
      CD_POLL_INTERVAL_SECONDS: ${CD_POLL_INTERVAL_SECONDS:-300}
      # Seconds to wait after container (re)start before health-checking.
      CD_HEALTH_CHECK_DELAY_SECONDS: ${CD_HEALTH_CHECK_DELAY_SECONDS:-30}
      # Set to "false" to disable automatic rollback on health-check failure.
      CD_ROLLBACK_ON_FAILURE: ${CD_ROLLBACK_ON_FAILURE:-true}
      # Set to "true" to log actions without executing them.
      CD_DRY_RUN: ${CD_DRY_RUN:-false}

      # ---- Notifications (optional) ----------------------------------------
      # Slack incoming-webhook URL to post deploy/rollback events.
      CD_NOTIFY_SLACK_WEBHOOK_URL: ${CD_NOTIFY_SLACK_WEBHOOK_URL:-}
      # Discord incoming-webhook URL to post deploy/rollback events.
      CD_NOTIFY_DISCORD_WEBHOOK_URL: ${CD_NOTIFY_DISCORD_WEBHOOK_URL:-}

      # Docker socket location inside the container.
      DOCKER_HOST: unix:///run/container.sock

    volumes:
      # Docker socket — required for container management.
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/run/container.sock

      # Named volume for deploy state persistence across daemon restarts.
      - codex-slack-cd-state:/opt/codex-slack/data/cd

volumes:
  codex-slack-cd-state:
