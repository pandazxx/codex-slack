# CI override — used by GitHub Actions for test runs.
# Builds the test stage of Dockerfile. No Traefik labels; no published ports.
services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  mosquitto:
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
