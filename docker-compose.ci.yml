# CI testing configuration — runs tests in container
# Invoked by CI workflows and .sre/test.sh via:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml ...
#
# Dockerfile.test bakes src+tests into the image so no volume mounts are needed,
# enabling use with remote Docker hosts (DOCKER_HOST=ssh://...) as well as CI runners.

services:
  master:
    build:
      context: .
      dockerfile: Dockerfile.test
      cache_from:
        - type=gha,scope=test
      cache_to:
        - type=gha,mode=max,scope=test
    image: codex-slack:test
    working_dir: /opt/codex-slack
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/opt/codex-slack"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - internal

  # --- Database services for the CI matrix (design section 10) --------------
  # Started explicitly by .sre/test-db.sh. The postgres leg layers
  # docker-compose.postgres.yml instead (same postgres:17-alpine pin).
  mysql:
    profiles: ["ci-mysql"]
    # >= 8.0.16 is the floor for CHECK enforcement (design section 12, Phase 2).
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-ci-test-only}
      MYSQL_DATABASE: master
      MYSQL_USER: master
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ci-test-only}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # TCP ping: the init-time temporary server has networking disabled, so
      # this only passes once the real server is up.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - internal
