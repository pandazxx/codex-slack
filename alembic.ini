[alembic]
# The URL is overridden at runtime by env.py from DATABASE_URL / MASTER_DATA_DIR.
# Keeping a placeholder here satisfies alembic's config parser.
script_location = alembic
sqlalchemy.url = sqlite+pysqlite:///%(here)s/master.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
