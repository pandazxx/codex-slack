services:
  codex-agent-foo:
    image: codex-slack-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-agent-foo
    restart: unless-stopped
    working_dir: /workspace
    command: ["python", "-m", "src.bot.main"]
    environment:
      SLACK_BOT_TOKEN: ${FOO_SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${FOO_SLACK_APP_TOKEN}
      SLACK_ALLOWED_CHANNELS: ${FOO_SLACK_ALLOWED_CHANNELS}
      CODEX_WORKSPACE_PATH: /workspace
      BOT_LOG_FILE: /workspace/logs/bot.log
      CODEX_SESSION_ID: ${FOO_CODEX_SESSION_ID}
      CODEX_TIMEOUT_SECONDS: ${FOO_CODEX_TIMEOUT_SECONDS}
      GH_TOKEN: ${FOO_GH_TOKEN}
      GITHUB_TOKEN: ${FOO_GH_TOKEN}
      GIT_USER_NAME: ${FOO_GIT_USER_NAME}
      GIT_USER_EMAIL: ${FOO_GIT_USER_EMAIL}
      CODEX_COMMAND_TEMPLATE: codex exec --dangerously-bypass-approvals-and-sandbox resume {session_id} -
      CODEX_COMMAND_TEMPLATE_NO_SESSION: codex exec --dangerously-bypass-approvals-and-sandbox -
    volumes:
      - ${FOO_WORKSPACE_PATH}:/workspace
      - ${FOO_WORKSPACE_PATH}/logs:/workspace/logs
      - ${HOME}/.codex/auth.json:/run/secrets/codex_auth.json:ro
      - ${HOME}/.codex/sessions:/run/secrets/codex_sessions:ro

  codex-agent-bar:
