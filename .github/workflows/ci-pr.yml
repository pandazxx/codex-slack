name: CI — PR Tests

# Runs on every pull-request commit targeting master.
# Purpose: gate merges on a passing test suite and valid Docker builds.
# No images are pushed here; publishing only happens from publish-*.yml on master/tags.

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - "Dockerfile.test"
      - "Dockerfile.agent-minimal"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "docker/entrypoint.sh"
      - ".github/workflows/ci-pr.yml"

permissions:
  contents: read

jobs:
  # ── 1. Unit / integration tests (in container for parity with dev) ──────────
  test:
    name: pytest (containerized)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.test
          load: true
          tags: codex-slack:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Run pytest suite
        run: docker run --rm codex-slack:test pytest -vv tests/ --tb=short

  # ── 2. Docker build validation (no push) ────────────────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build master image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=master
          cache-to: type=gha,mode=max,scope=master

      - name: Build agent-minimal image + smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent-minimal
          load: true
          tags: codex-slack-agent-minimal:pr-smoke
          cache-from: type=gha,scope=agent-minimal
          cache-to: type=gha,mode=max,scope=agent-minimal

      - name: Smoke test agent-minimal runtime contract
        run: |
          docker run --rm codex-slack-agent-minimal:pr-smoke sh -lc '
            codex --version &&
            claude --version &&
            gh --version &&
            python -m src.agent.main --help >/dev/null
          '
