name: Publish Minimal Agent Image

# Manual / ad-hoc build of the agent-minimal worker image.
#
# Automated builds are handled by dedicated workflows:
#   - ci-pr.yml          — PR gate (build, no push)
#   - build-on-demand.yml — agent test bed builds (:sha-<hash>)
#   - build-rc.yml        — RC builds from feature branch tags (:v1.2.3-rc1, :rc)
#   - promote-release.yml — release promotion by retagging :rc → :v1.2.3
#
# This workflow is retained for ad-hoc manual builds only.
# It no longer triggers on master branch pushes or version tags.
#
# See docs/design/cicd-pipeline.md for the full pipeline design.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/codex-slack-agent-minimal
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      # Single build: load into local daemon for smoke test AND push to registry.
      - name: Build, load and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent-minimal
          load: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=agent-minimal
          cache-to: type=gha,mode=max,scope=agent-minimal

      - name: Smoke test runtime contract
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm "$IMAGE" sh -lc '
            codex --version &&
            claude --version &&
            gh --version &&
            python -m src.agent.main --help >/dev/null
          '
