name: Publish Minimal Agent Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "Dockerfile.agent-minimal"
      - "docker/entrypoint.sh"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/publish-agent-minimal.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/codex-slack-agent-minimal
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build smoke image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent-minimal
          load: true
          tags: codex-slack-agent-minimal:smoke

      - name: Smoke test runtime contract
        run: |
          docker run --rm codex-slack-agent-minimal:smoke sh -lc '
            codex --version &&
            claude --version &&
            python -m src.agent.main --help >/dev/null
          '

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent-minimal
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
