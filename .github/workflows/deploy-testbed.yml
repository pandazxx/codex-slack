name: Deploy to Testbed

# Deploys a pre-built image to the testbed via SSH.
# Intended to be triggered after build-on-demand.yml produces a :sha-<hash> image.
#
# Usage (agent or human)
# ----------------------
#   gh workflow run deploy-testbed.yml \
#     --ref topic/my-branch \
#     --field image_tag=sha-ac4b453
#
# Prerequisites
# -------------
#   - TESTBED_SSH_KEY  : private SSH key for ubuntu@<testbed host> (repo secret)
#   - TESTBED_HOST     : testbed hostname/IP (repo secret, e.g. 10.10.10.238)
#   - TESTBED_COMPOSE_DIR : absolute path on the testbed host to the compose project
#                           directory (repo secret, e.g. /opt/codex-slack)
#
# The workflow:
#   1. SSHes into the testbed host.
#   2. Sets MASTER_RUNTIME_IMAGE to the provided ghcr.io tag.
#   3. Runs docker compose pull + up --force-recreate.
#   4. Waits for the health endpoint to return {"status":"ok"}.
#   5. Reports container state and any errors.
#
# See docs/design/cicd-pipeline.md for the full pipeline design.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-ac4b453, label-feat-foo)"
        required: true
      image_repo:
        description: "GHCR image repo (default: ghcr.io/<owner>/codex-slack-master)"
        required: false
        default: ""
      docker_gid:
        description: "Docker socket GID on the testbed host"
        required: false
        default: "988"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to testbed
    runs-on: ubuntu-latest

    steps:
      - name: Resolve image repo
        id: image
        run: |
          REPO="${{ inputs.image_repo }}"
          if [[ -z "${REPO}" ]]; then
            REPO="ghcr.io/${{ github.repository_owner }}/codex-slack-master"
          fi
          echo "full=${REPO}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.TESTBED_SSH_KEY }}" > ~/.ssh/testbed_key
          chmod 600 ~/.ssh/testbed_key
          ssh-keyscan -H "${{ secrets.TESTBED_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Pull new image on testbed
        run: |
          ssh -i ~/.ssh/testbed_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ubuntu@${{ secrets.TESTBED_HOST }} \
            "docker pull ${{ steps.image.outputs.full }}"

      - name: Deploy stack on testbed
        run: |
          ssh -i ~/.ssh/testbed_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ubuntu@${{ secrets.TESTBED_HOST }} \
            "cd ${{ secrets.TESTBED_COMPOSE_DIR }} && \
             MASTER_RUNTIME_IMAGE=${{ steps.image.outputs.full }} \
             DOCKER_GID=${{ inputs.docker_gid }} \
             docker compose stop master && \
             docker compose rm -f master && \
             MASTER_RUNTIME_IMAGE=${{ steps.image.outputs.full }} \
             DOCKER_GID=${{ inputs.docker_gid }} \
             docker compose up -d"

      - name: Wait for master health check
        run: |
          ssh -i ~/.ssh/testbed_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ubuntu@${{ secrets.TESTBED_HOST }} \
            '
              MASTER_PORT="${MASTER_PORT:-8080}"
              ATTEMPTS=0
              MAX_ATTEMPTS=20
              until curl -sf "http://localhost:${MASTER_PORT}/health" | grep -q "ok"; do
                ATTEMPTS=$((ATTEMPTS + 1))
                if [[ $ATTEMPTS -ge $MAX_ATTEMPTS ]]; then
                  echo "Health check timed out after ${MAX_ATTEMPTS} attempts"
                  exit 1
                fi
                echo "Waiting for master to be healthy (attempt ${ATTEMPTS}/${MAX_ATTEMPTS})..."
                sleep 5
              done
              echo "Master is healthy."
            '

      - name: Report container state
        if: always()
        run: |
          ssh -i ~/.ssh/testbed_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ubuntu@${{ secrets.TESTBED_HOST }} \
            "cd ${{ secrets.TESTBED_COMPOSE_DIR }} && \
             docker compose ps && \
             echo '--- master logs (last 30 lines) ---' && \
             docker compose logs --tail=30 master"

      - name: Summary
        if: always()
        run: |
          echo "## Testbed deploy: \`${{ steps.image.outputs.full }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.image.outputs.full }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Host | \`${{ secrets.TESTBED_HOST }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DOCKER_GID | \`${{ inputs.docker_gid }}\` |" >> "$GITHUB_STEP_SUMMARY"
