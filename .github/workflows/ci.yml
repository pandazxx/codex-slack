name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build master

      - name: Run tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm master python -m pytest -v --tb=short

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes --remove-orphans
