# Remote development environment — no bind mounts (they don't cross SSH).
# Used when DEV_DOCKER_HOST is set to a remote Docker host.
# Relies on images being pre-built with source code.
#
# Routing: master is exposed via Traefik labels at
#   master.${BRANCH_SLUG}.dev.docker-testbed.local
# Traefik must be running on the same remote Docker host (.sre/traefik-up.sh).
# If Traefik is not present, env-up.sh falls back to a per-branch published port.
# See docs/sre-decisions/2026-05-07-traefik-multi-env-routing.md.

services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-slack-master:runtime
    environment:
      MASTER_PORT: 8080
      MASTER_DRY_RUN: "false"
      CONTAINER_RUNTIME: docker
      DOCKER_HOST: unix:///run/container.sock
      CONTAINER_HOST: unix:///run/container.sock
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MASTER_AGENT_NETWORK: ${COMPOSE_PROJECT_NAME:-codex-slack}_internal
      # Optional: set these in .env.local for testing
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - mosquitto
    networks:
      - internal
      - sre_ingress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=sre_ingress
      - traefik.http.routers.master-${BRANCH_SLUG:-default}.rule=Host(`master.${BRANCH_SLUG:-default}.dev.docker-testbed.local`)
      - traefik.http.routers.master-${BRANCH_SLUG:-default}.entrypoints=web
      - traefik.http.services.master-${BRANCH_SLUG:-default}.loadbalancer.server.port=8080

  mosquitto:
    image: eclipse-mosquitto:2
    # Same as prod; not exposed via Traefik. Access via docker compose exec.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$SYS/broker/uptime", "-c", "1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  sre_ingress:
    external: true
    name: sre_ingress
