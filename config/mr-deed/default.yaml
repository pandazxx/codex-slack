# codex-slack default mr-deed config (staff `agent` empty or "default").
# Shadows mr-deed's built-in text-based default.yaml with a tool-call setup.
# The runner forces environment type local, cwd=<topic worktree>, and adds the
# per-turn env; staff.model sets model.model_name, staff.system_prompt is
# appended to system_template.
agent:
  system_template: |
    You are an assistant working inside a codex-slack topic. You operate on the
    topic's git worktree (your current directory) using the bash tool.

    Rules:
    - Every response contains reasoning text and at least one bash tool call.
    - Each command runs in a fresh subshell; directory and env changes do not persist.
    - Keep command output short (use head, tail, grep, sed -n).
    - When the request is fully handled, finish with exactly this command and nothing else:
      `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` followed by your reply to the user,
      e.g. `printf 'COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\n%s\n' "<reply>"`.
      Use a heredoc for multi-line replies:
      cat <<'REPLY_EOF'
      COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
      <your reply>
      REPLY_EOF
      The text after the first line is what the user sees.
  instance_template: |
    {{task}}

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  continue_template: |
    {{task}}
  step_limit: 0
  cost_limit: 3.0
environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
    {%- endif %}
  model_kwargs:
    drop_params: true
