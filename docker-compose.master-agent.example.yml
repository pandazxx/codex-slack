x-podman:
  in_pod: false

services:
  codex-slack-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MASTER_RUNTIME_IMAGE:-codex-slack-v1-uat}
    container_name: ${CD_CONTAINER_NAME:-codex-slack-master}
    working_dir: /opt/codex-slack
    command: ["python", "-m", "src.master.main"]
    userns_mode: "keep-id"
    user: "${UID:-1000}:${GID:-1000}"
    security_opt:
      - label=disable
    environment:
      MASTER_FRONTENDS: ${MASTER_FRONTENDS:-slack}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SSH_AUTH_SOCK: /ssh-agent
      MASTER_GIT_USER_NAME: ${MASTER_GIT_USER_NAME:-}
      MASTER_GIT_USER_EMAIL: ${MASTER_GIT_USER_EMAIL:-}
      MASTER_CODEX_AUTH_JSON_PATH: ${MASTER_CODEX_AUTH_JSON_PATH:-}
      MASTER_CLAUDE_CONFIG_DIR_PATH: ${MASTER_CLAUDE_CONFIG_DIR_PATH:-}
      # Host-side absolute path to this project directory (used to resolve
      # config/claude-global/ as a bind-mount source for agent containers).
      MASTER_PROJECT_DIR: ${MASTER_PROJECT_DIR:-}
      MASTER_SSH_AUTH_SOCK_PATH: ${MASTER_SSH_AUTH_SOCK_PATH:-}
      MASTER_SSH_KNOWN_HOSTS_PATH: ${MASTER_SSH_KNOWN_HOSTS_PATH:-}
      MASTER_ADMIN_CHANNELS: ${MASTER_ADMIN_CHANNELS:-}
      DISCORD_ADMIN_CHANNELS: ${DISCORD_ADMIN_CHANNELS:-}
      MASTER_AGENT_BASE_IMAGE: ${MASTER_AGENT_BASE_IMAGE:-codex-slack-v1-uat}
      MASTER_REGISTRY_PATH: /opt/codex-slack/data/master/agents.json
      MASTER_DEFAULT_AGENT_ADAPTER: ${MASTER_DEFAULT_AGENT_ADAPTER:-codex}
      MASTER_AGENT_COMMAND_TEMPLATE: ${MASTER_AGENT_COMMAND_TEMPLATE:-codex exec --dangerously-bypass-approvals-and-sandbox -}
      MASTER_CODEX_COMMAND_TEMPLATE: ${MASTER_CODEX_COMMAND_TEMPLATE:-codex exec --dangerously-bypass-approvals-and-sandbox resume --last -}
      MASTER_CLAUDE_COMMAND_TEMPLATE: ${MASTER_CLAUDE_COMMAND_TEMPLATE:-claude -p --output-format json --dangerously-skip-permissions}
      MASTER_AGENT_TIMEOUT_SECONDS: ${MASTER_AGENT_TIMEOUT_SECONDS:-120}
      MASTER_COMMAND_RATE_LIMIT_COUNT: ${MASTER_COMMAND_RATE_LIMIT_COUNT:-20}
      MASTER_COMMAND_RATE_LIMIT_WINDOW_SECONDS: ${MASTER_COMMAND_RATE_LIMIT_WINDOW_SECONDS:-60}
      CODEX_CONTAINER_MODE: bot
      CONTAINER_HOST: unix:///run/podman/podman.sock
    volumes:
      - ${MASTER_DATA_DIR:-./data/master}:/opt/codex-slack/data/master
      # Mount config/claude-global from the host project dir so the master can
      # auto-detect it and pass a valid host path to agent container mounts.
      - ${MASTER_PROJECT_DIR:-.}/config/claude-global:/opt/codex-slack/config/claude-global:ro
      - ${MASTER_SSH_AUTH_SOCK_PATH:-/dev/null}:/ssh-agent
      - ${PODMAN_SOCKET_PATH:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
    stop_grace_period: 5m
    stdin_open: true
    tty: true
